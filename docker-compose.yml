version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: teledis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: teledis-mqtt:local
    build:
      context: ./infrastructure/mqtt
      dockerfile: Dockerfile
    container_name: teledis-mqtt

    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_pub -h localhost -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t teledis/healthcheck -m ok -q 1
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}

    networks:
      - backend_network
      - mqtt_network

    ports:
      - "1883:1883"

    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teledis-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - backend_network
      - mqtt_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teledis-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    networks:
      - frontend_network
      - backend_network
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: teledis-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - frontend_network
      - backend_network

networks:
  frontend_network:
  backend_network:
  mqtt_network:

volumes:
  postgres_data:
  mqtt_data:
  mqtt_logs:
